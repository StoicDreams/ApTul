[package]
name = "webapp"
version = "0.1.28"
edition = "2024"

[lib]
crate-type = ["cdylib"] # Critical for wasm libraries

[dependencies]
webui = { git = "https://github.com/StoicDreams/WebUI", branch = "main", features = [
] }
console_error_panic_hook = "0.1"
base64 = "0.22"
kurbo = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# The default features use threads (rayon) and the system clock, which the browser does not provide.
lopdf = { version = "0.47", default-features = false, features = ["wasm_js"] }

[dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg", "webp", "bmp", "ico"]

[dev-dependencies]
rqrr = "0.11"
